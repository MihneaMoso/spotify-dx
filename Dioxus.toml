[application]

# App is the root component of your dioxus app
app = "src/main.rs"

# Web asset directory
asset_dir = "assets"

# Whether to include the default stylesheet for your app
default_stylesheet = false

name = "Spotify DX"
default_platform = "desktop"

[web]
# The web build is deployed at /spotify-dx/app/ on GitHub Pages (project site
# under the `/spotify-dx/` path prefix, with the app in its own subdirectory).
out_dir = "web/app"

[web.app]

title = "Spotify DX"
# The app is served under /spotify-dx/app/ on GitHub Pages, so all generated
# asset URLs must be prefixed with that base path (build-web.sh relies on this).
base_path = "spotify-dx/app"

[desktop]

# Specify the package name. Only used on Windows (MSI) so far
product_name = "Spotify DX"

# Main window icon
# icon = "assets/icon.ico"

# The asset root directory for desktop
# assets_dir = "public"

# Enable the file engine which allows the asset macro to work on desktop
file_engine = true

# This will only be used when using the dx build/package command
# on windows with the msi format.
# It must be an UUID formatted string, and generated once.
# you can use the `uuidgen` command to generate a new one
# e.g. 1e7c5852-5d35-4b93-b8ce-313bfdc76b41
# bundle_id = ""

filename = "spotify-dx"

[mobile]

# The minimum SDK version supported by your app.
# MUST be >= 30 (Android 11): dioxus/tao call
# WindowManagerImpl.getCurrentWindowMetrics() which only exists on API 30+.
# Lower versions crash with NoSuchMethodError. See RULES.md §6.9d.
min_sdk_version = 30

# The bundle identifier for your app
bundle_id = "com.spotifydx.app"

# Android package name
package = "com.spotifydx.app"

[server]

# The port that the server listens on.
port = 8080
