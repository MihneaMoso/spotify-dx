[package]
name    = "spotify-dx"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Spotify client written in Rust using Dioxus"
license = "MIT"

[features]
default  = ["desktop"]
# `native` = a non-WASM renderer is present (desktop OR mobile). Both are wry
# based: dioxus::mobile is a re-export of dioxus::desktop. Platform-agnostic
# native code (media sink, adblock, playback_sdk bootstrap) is gated here so it
# compiles for desktop and mobile alike; only WASM (web) diverges.
native   = ["dep:wry"]
desktop  = ["dioxus/desktop", "native", "dep:gtk"]
mobile   = ["dioxus/mobile", "native"]
web      = ["dioxus/web"]

[dependencies]
# ── UI framework ──────────────────────────────────────────────────────────────
dioxus        = { version = "0.7", features = ["router"] }
dioxus-router = { version = "0.7" }
# "0.53" unifies with the wry version dioxus-desktop 0.7.10 already depends on,
# otherwise cargo resolves two different wry copies into the same binary.
wry           = { version = "0.53", optional = true }   # hidden webview for Web Playback SDK

# ── Networking ────────────────────────────────────────────────────────────────
url           = "2"

# ── Auth / crypto ─────────────────────────────────────────────────────────────
# sha2/base64 are NOT auth-only: store.rs hashes URLs and media/images.rs base64s
# images. Keep them. oauth2/rand were only used by the deleted PKCE flow.
sha2          = "0.10"
base64        = "0.22"

# ── Ad-block ──────────────────────────────────────────────────────────────────
# Brave-style ad-block engine. Compiles to wasm; its DNS-over-HTTPS helper
# (`hickory-resolver`) is native-only and lives in the target-gated block below.
adblock = "0.13"

# ── Serialization ─────────────────────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# ── Image / media (decode only; output is target-specific) ────────────────────
image         = { version = "0.25", default-features = false, features = ["jpeg","png","webp"] }

# ── Async / misc ──────────────────────────────────────────────────────────────
futures         = "0.3"
anyhow          = "1"
thiserror       = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell       = "1"
parking_lot     = "0.12"
chrono          = { version = "0.4", features = ["serde"] }
urlencoding     = "2"
async-trait     = "0.1"

# ── Per-target deps ───────────────────────────────────────────────────────────
# Native (desktop/mobile): full multi-threaded tokio, native reqwest, OS
# keychain/filesystem/DNS, and the local symphonia + rodio/cpal pipeline.
# Replaced on wasm by the `platform` seam (browser fetch, localStorage, WebAudio).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio         = { version = "1", features = ["full", "sync"] }
reqwest       = { version = "0.12", default-features = false, features = ["json","cookies","gzip","brotli","stream","rustls-tls"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["dns-over-https-rustls","tokio-runtime"] }
keyring       = { version = "3", features = ["sync-secret-service", "linux-native"] }   # cross-platform keychain
dirs          = "5"
symphonia     = { version = "0.6.1", features = ["flac", "aac", "mp3", "isomp4", "ogg", "pcm"] }
rodio         = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }

# Desktop-only deps for the in-app updater's staged-swap path: the release
# tarball is unpacked and the single binary extracted (see src/updater.rs).
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
tar = "0.4"
flate2 = "1"

# wasm: single-threaded current-thread tokio (no net/process/signal/mio), reqwest
# with just `json` (its wasm/fetch backend is selected automatically), plus the
# JS glue and web APIs for the storage/audio seams.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio         = { version = "1", features = ["rt", "time", "sync", "macros"] }
reqwest       = { version = "0.12", default-features = false, features = ["json"] }
getrandom     = { version = "0.2", features = ["js"] }
wasm-bindgen  = "0.2"
wasm-bindgen-futures = "0.4"
web-sys       = { version = "0.3", features = ["Window", "Storage", "HtmlAudioElement", "HtmlMediaElement", "Document", "Element", "Location", "Request", "RequestInit", "RequestCredentials", "RequestMode", "Response", "Headers"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
# Matches the jni version wry 0.53.5 pins (its `on_webview_created` /
# `dispatch` callbacks use these exact `jni` types) so the android_views
# view-layering manager can drive wry's Android view tree without a second
# jni copy resolving into the binary.
jni              = { version = "0.21" }

# The login flow hosts the real open.spotify.com page in a GTK window (Linux).
# Version is pinned to what tao/wry already pull in (gtk 0.18).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[profile.dev]
opt-level = 1

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
