[package]
name    = "spotify-dx"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Spotify client written in Rust using Dioxus"
license = "MIT"

[features]
default  = ["desktop"]
desktop  = ["dioxus/desktop", "dep:wry"]
mobile   = ["dioxus/mobile"]
web      = ["dioxus/web"]

[dependencies]
# ── UI framework ──────────────────────────────────────────────────────────────
dioxus        = { version = "0.6", features = ["router"] }
dioxus-router = { version = "0.6" }
# "0.45" unifies with the wry version dioxus-desktop 0.6.3 already depends on,
# otherwise cargo resolves two different wry copies into the same binary.
wry           = { version = "0.45", optional = true }   # hidden webview for Web Playback SDK

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio         = { version = "1", features = ["full"] }
futures       = "0.3"

# ── HTTP / networking ─────────────────────────────────────────────────────────
# rustls-tls (instead of the native-tls default) keeps the tree OpenSSL-free and
# unifies with oauth2's own rustls reqwest feature.
reqwest       = { version = "0.12", default-features = false, features = ["json","cookies","gzip","brotli","stream","rustls-tls"] }
url           = "2"
webbrowser    = "1"

# ── Auth / crypto ─────────────────────────────────────────────────────────────
sha2          = "0.10"
base64        = "0.22"
rand          = "0.8"
oauth2        = "4"

# ── Ad-block / DNS ────────────────────────────────────────────────────────────
# Pure-Rust trie for fast hostname lookup
radix_trie    = "0.2"
# Async DNS resolver for DNS-over-HTTPS
hickory-resolver = { version = "0.24", default-features = false, features = ["dns-over-https-rustls","tokio-runtime"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# ── Secure storage ────────────────────────────────────────────────────────────
keyring       = { version = "3", features = ["sync-secret-service", "linux-native"] }   # cross-platform keychain

# ── Image / media ─────────────────────────────────────────────────────────────
image         = { version = "0.25", default-features = false, features = ["jpeg","png","webp"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
anyhow        = "1"
thiserror     = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell     = "1"
parking_lot   = "0.12"
chrono        = { version = "0.4", features = ["serde"] }
dirs          = "5"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"