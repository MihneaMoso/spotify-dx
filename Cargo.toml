[package]
name    = "spotify-dx"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Spotify client written in Rust using Dioxus"
license = "MIT"

[features]
default  = ["desktop"]
desktop  = ["dioxus/desktop", "dep:wry", "dep:gtk"]
mobile   = ["dioxus/mobile"]
web      = ["dioxus/web"]

[dependencies]
# ── UI framework ──────────────────────────────────────────────────────────────
dioxus        = { version = "0.7", features = ["router"] }
dioxus-router = { version = "0.7" }
# "0.53" unifies with the wry version dioxus-desktop 0.7.10 already depends on,
# otherwise cargo resolves two different wry copies into the same binary.
wry           = { version = "0.53", optional = true }   # hidden webview for Web Playback SDK

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio         = { version = "1", features = ["full", "sync"] }
futures       = "0.3"

# ── HTTP / networking ─────────────────────────────────────────────────────────
# rustls-tls (instead of the native-tls default) keeps the tree OpenSSL-free and
# unifies with oauth2's own rustls reqwest feature.
reqwest       = { version = "0.12", default-features = false, features = ["json","cookies","gzip","brotli","stream","rustls-tls"] }
url           = "2"
webbrowser    = "1"

# ── Auth / crypto ─────────────────────────────────────────────────────────────
# sha2/base64 are NOT auth-only: cache.rs hashes URLs and album_art.rs base64s
# images. Keep them. oauth2/rand were only used by the deleted PKCE flow.
sha2          = "0.10"
base64        = "0.22"

# ── Ad-block / DNS ────────────────────────────────────────────────────────────
# Brave-style ad-block engine (replaces the old radix_trie + custom parser)
adblock = "0.13"
# Async DNS resolver for DNS-over-HTTPS (used by adblock bootstrap only)
hickory-resolver = { version = "0.24", default-features = false, features = ["dns-over-https-rustls","tokio-runtime"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# ── Secure storage ────────────────────────────────────────────────────────────
keyring       = { version = "3", features = ["sync-secret-service", "linux-native"] }   # cross-platform keychain

# ── Image / media ─────────────────────────────────────────────────────────────
image         = { version = "0.25", default-features = false, features = ["jpeg","png","webp"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
anyhow        = "1"
thiserror     = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell     = "1"
parking_lot   = "0.12"
chrono        = { version = "0.4", features = ["serde"] }
dirs          = "5"
symphonia = { version = "0.6.1", features = ["flac", "aac", "mp3", "isomp4", "ogg", "pcm"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }
urlencoding = "2"
async-trait = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# The login flow hosts the real open.spotify.com page in a GTK window (Linux).
# Version is pinned to what tao/wry already pull in (gtk 0.18).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[profile.dev]
opt-level = 1

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"
