# Builds optimized desktop release binaries for all supported desktop platforms
# and publishes them as a GitHub Release.
#
# Triggered by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# (or run ./scripts/release.sh which does the tag + push for you.)
#
# Assets uploaded per target (consumed by install shells):
#   spotify-dx-<version>-<target>.tar.gz      (+ .sha256)   Linux/macOS
#   spotify-dx-<target>.tar.gz                unversioned alias (+ .sha256),
#                                              used for "latest" installs via
#                                              /releases/latest/download/
#   spotify-dx-<version>-<target>.zip         (+ .sha256)   Windows
#   spotify-dx-<target>.zip                   unversioned alias (+ .sha256)
#
# Unlike magic-run (a pure-Rust CLI), Spotify DX is a GTK/WebKit GUI, so the
# Linux targets are glibc (`*-linux-gnu`) with the system WebKit/GTK dev
# packages installed — a musl static build is not possible for a WebKit shell.
# macOS uses the native arm64 runner and Apple's toolchain for x86_64.
# Windows uses the system WebView2 (no GTK).

name: release

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]*"]

# Allow the "publish" job to create the GitHub Release and attach assets.
permissions:
  contents: write

env:
  BIN: spotify-dx
  # Release profile with LTO + strip (matches [profile.release] in Cargo.toml).
  PROFILE: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (GTK / WebKit webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary (desktop feature)
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --features desktop

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          base="${BIN}-${version}-${{ matrix.target }}"
          alias="${BIN}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/${BIN}"
          test -x "$bin"
          tar czf "${base}.tar.gz" -C "target/${{ matrix.target }}/release" "${BIN}"
          cp "${base}.tar.gz" "${alias}.tar.gz"
          hash() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          for f in "${base}.tar.gz" "${alias}.tar.gz"; do
            hash "$f" > "${f}.sha256"
          done
          # NOTE: macOS ships as a raw binary in the tarball for now (matching
          # the reference project). A proper .app bundle (+ codesigning +
          # notarization, and an .msi on Windows) is future platform tooling.

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          base="${BIN}-${version}-${{ matrix.target }}"
          alias="${BIN}-${{ matrix.target }}"
          rel="target/${{ matrix.target }}/release"
          bin="${rel}/${BIN}.exe"
          test -f "$bin"
          powershell -Command "Compress-Archive -Path '$(cygpath -w "${rel}/${BIN}.exe")' -DestinationPath '$(cygpath -w "${GITHUB_WORKSPACE}/${base}.zip")'"
          cp "${base}.zip" "${alias}.zip"
          hash() { sha256sum "$1"; }
          for f in "${base}.zip" "${alias}.zip"; do
            hash "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip
            *.sha256

  # Android APK — headless build, no Android Studio. `dx build --platform android`
  # auto-generates the entire Gradle project from the CLI's built-in template, so
  # there is nothing android/ to commit. The APK is signed with a generated
  # keystore via apksigner so it installs cleanly, then uploaded as a release asset.
  # See docs/PLATFORM_PARITY.md Phase D + RULES.md §6.9d.
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
      ANDROID_NDK_VERSION: 25.2.9519653
      # cargo does NOT expand env vars in .cargo/config.toml paths, and the
      # checked-in config points at a machine-specific NDK. These env overrides
      # take precedence over that config file for the aarch64-linux-android target.
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang
      CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.ANDROID_NDK_VERSION }}
          restore-keys: android-sdk-

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-linux-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-linux-android-

      - name: Install Android command-line tools + SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          unzip -q cmdtools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # `yes |` auto-accepts the SDK/NDK licenses. Under `set -o pipefail`,
          # `yes` dies with a benign SIGPIPE (141) once sdkmanager stops reading;
          # sdkmanager writes the accepted-license files under
          # ${ANDROID_HOME}/licenses/. On a headless runner the interactive
          # prompt can fail (exit 1) even though the download itself is fine, so
          # we never let it abort the step: surface its output, and if no
          # accepted-license file exists afterwards, drop in the well-known
          # accepted hashes directly. The `ndk;…` install below still validates
          # acceptance and fails loudly if this ever did not work.
          licenses_dir="${ANDROID_HOME}/licenses"
          set +e
          yes | "$sdkmanager" --licenses >/tmp/sdk-licenses.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 141 ]; then
            echo "sdkmanager --licenses exited ${rc} (details):" >&2
            tail -n 40 /tmp/sdk-licenses.log >&2
          fi
          if [ ! -f "${licenses_dir}/android-sdk-license" ]; then
            echo "no accepted-license file found; writing known-good license hashes" >&2
            mkdir -p "${licenses_dir}"
            printf '%s\n' \
              8933bad161af4178b1185d1a37fbf41ea5269c55 \
              d56f5187479451eabf01fb78af6dfcb131a6481e \
              24333f8a63b6825ea9c5514f83c2829b004d1fee \
              > "${licenses_dir}/android-sdk-license"
            printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd \
              > "${licenses_dir}/android-sdk-preview-license"
          fi
          # The 0.7.10 android template defaults compileSdk/targetSdk to 34
          # (no `[android]` override in Dioxus.toml), so AGP needs the
          # android-34 platform + its build-tools for assembleRelease.
          "$sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Create un-versioned NDK tool symlinks (cc-rs requires exact names)
        shell: bash
        run: |
          set -euo pipefail
          bin="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The un-versioned `aarch64-linux-android-clang` wrapper defaults the
          # API level to 21, whose sysroot lib dir has no libaaudio.so — `cpal`
          # links `-laaudio` → `Unable to find library -laaudio`. Point it at a
          # versioned wrapper >= 26 (where libaaudio lives), preferring the
          # app's min_sdk (30) so the selected sysroot matches the manifest.
          for api in 30 33 31 29 28 26 24 21; do
            if [ -x "${bin}/aarch64-linux-android${api}-clang" ]; then
              ln -sfn "aarch64-linux-android${api}-clang" "${bin}/aarch64-linux-android-clang"
              break
            fi
          done
          [ -e "${bin}/aarch64-linux-android-clang" ] \
            || { echo "no versioned aarch64 clang wrapper in NDK" >&2; exit 1; }
          ln -sfn llvm-ar "${bin}/aarch64-linux-android-ar"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cargo install dioxus-cli --version 0.7.10 --locked 2>/dev/null || true
          # dx is not on PATH from the install; use the cargo bin dir
          export PATH="${HOME}/.cargo/bin:${PATH}"
          # Explicit `--target` — the default android triple follows the HOST
          # arch (x86_64 on CI runners), which would silently produce an x86_64
          # APK. `dx build` generates the Gradle project + compiles the Rust
          # .so, but without a `[bundle.android]` config it only runs Gradle's
          # `assembleDebug`; we run `assembleRelease` ourselves for a real
          # release APK (see RULES.md §6.9d).
          dx build --platform android --release --target aarch64-linux-android

          # Gradle project generated by dx (same path the build log reports).
          android_dir="${GITHUB_WORKSPACE}/target/dx/spotify-dx/release/android/app"
          cd "${android_dir}"
          # The 0.7.10 template targets Java 17, which matches setup-java 17;
          # we just skip the lint-vital tasks that crash under AGP 8.7 (see
          # DioxusLabs/dioxus#5251). Output lands unsigned
          # (no [bundle.android] signing config) at app/build/outputs/apk/release/.
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x lintVitalReportRelease
          cd "${GITHUB_WORKSPACE}"

          apk_dir="${android_dir}/app/build/outputs/apk/release"
          ls -la "${apk_dir}"

      - name: Sign APK with generated keystore
        shell: bash
        run: |
          set -euo pipefail
          android_dir="${GITHUB_WORKSPACE}/target/dx/spotify-dx/release/android/app"
          apk_dir="${android_dir}/app/build/outputs/apk/release"
          apk="$(ls "${apk_dir}"/app-release-unsigned.apk 2>/dev/null || ls "${apk_dir}"/app-release.apk | head -1)"
          [ -n "${apk}" ] && [ -f "${apk}" ] || { echo "no release APK found in ${apk_dir}" >&2; exit 1; }
          bt="${ANDROID_HOME}/build-tools/34.0.0"
          ks="${HOME}/debug.keystore"
          keytool -genkeypair -v -keystore "$ks" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Spotify DX, OU=DX, O=Spotify DX, L=Nowhere, ST=Nowhere, C=US" 2>/dev/null
          "${bt}/apksigner" sign --ks "$ks" --ks-pass pass:android \
            --key-pass pass:android --out "${apk%.apk}-signed.apk" "$apk"
          "${bt}/apksigner" verify --verbose "${apk%.apk}-signed.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          if-no-files-found: error
          path: target/dx/spotify-dx/release/android/app/app/build/outputs/apk/release/*-signed.apk

  # Web (WASM) — build the browser bundle with `dx build --platform web` and ship
  # the generated site as an artifact. Note: web login (credentialed
  # cross-origin get_access_token) is still live-validation-pending; the bundle
  # builds regardless — see RULES.md §6.9c.
  web:
    runs-on: ubuntu-latest
    env:
      PROFILE: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32-

      - name: Build web (wasm) bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo install dioxus-cli --version 0.7.10 --locked 2>/dev/null || true
          dx build --platform web --release
          # `dx build` does NOT honor `out_dir`: web output always goes to
          # target/dx/<crate>/<profile>/web/public (DioxusLabs/dioxus#3328), so
          # package from there rather than a repo-root `dist/`.
          web_out="target/dx/spotify-dx/release/web/public"
          test -d "$web_out"
          version="${GITHUB_REF_NAME}"
          tar czf "${BIN}-${version}-web.tar.gz" -C "$web_out" .
          cp "${BIN}-${version}-web.tar.gz" "${BIN}-web.tar.gz"
          sha256sum "${BIN}-${version}-web.tar.gz" "${BIN}-web.tar.gz" > "${BIN}-web-sha256.txt"

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            spotify-dx-*-web.tar.gz
            spotify-dx-web-sha256.txt

  publish:
    needs: [build, android-apk, web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "spotify-dx ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
