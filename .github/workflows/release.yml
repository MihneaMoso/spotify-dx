# Builds optimized desktop release binaries for all supported desktop platforms
# and publishes them as a GitHub Release.
#
# Triggered by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# (or run ./scripts/release.sh which does the tag + push for you.)
#
# Assets uploaded per target (consumed by install shells):
#   spotify-dx-<version>-<target>.tar.gz      (+ .sha256)   Linux/macOS
#   spotify-dx-<target>.tar.gz                unversioned alias (+ .sha256),
#                                              used for "latest" installs via
#                                              /releases/latest/download/
#   spotify-dx-<version>-<target>.zip         (+ .sha256)   Windows
#   spotify-dx-<target>.zip                   unversioned alias (+ .sha256)
#
# Unlike magic-run (a pure-Rust CLI), Spotify DX is a GTK/WebKit GUI, so the
# Linux targets are glibc (`*-linux-gnu`) with the system WebKit/GTK dev
# packages installed — a musl static build is not possible for a WebKit shell.
# macOS uses the native arm64 runner and Apple's toolchain for x86_64.
# Windows uses the system WebView2 (no GTK).

name: release

on:
  push:
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]*"]

# Allow the "publish" job to create the GitHub Release and attach assets.
permissions:
  contents: write

env:
  BIN: spotify-dx
  # Release profile with LTO + strip (matches [profile.release] in Cargo.toml).
  PROFILE: release
  # Pin the version embedded by build.rs (updater::CURRENT_VERSION) to the
  # release tag, so an installed vX.Y.Z reports exactly that.
  SPOTIFY_DX_RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (GTK / WebKit webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary (desktop feature)
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --features desktop

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          base="${BIN}-${version}-${{ matrix.target }}"
          alias="${BIN}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/${BIN}"
          test -x "$bin"
          tar czf "${base}.tar.gz" -C "target/${{ matrix.target }}/release" "${BIN}"
          cp "${base}.tar.gz" "${alias}.tar.gz"
          hash() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          for f in "${base}.tar.gz" "${alias}.tar.gz"; do
            hash "$f" > "${f}.sha256"
          done
          # NOTE: macOS ships as a raw binary in the tarball for now (matching
          # the reference project). A proper .app bundle (+ codesigning +
          # notarization, and an .msi on Windows) is future platform tooling.

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          base="${BIN}-${version}-${{ matrix.target }}"
          alias="${BIN}-${{ matrix.target }}"
          rel="target/${{ matrix.target }}/release"
          bin="${rel}/${BIN}.exe"
          test -f "$bin"
          powershell -Command "Compress-Archive -Path '$(cygpath -w "${rel}/${BIN}.exe")' -DestinationPath '$(cygpath -w "${GITHUB_WORKSPACE}/${base}.zip")'"
          cp "${base}.zip" "${alias}.zip"
          hash() { sha256sum "$1"; }
          for f in "${base}.zip" "${alias}.zip"; do
            hash "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip
            *.sha256

  # Android APK — Phase 7 cutover: the OWNED Kotlin app in android/ (primary
  # build path, docs/KOTLIN_MIGRATION.md §13). No dx generator, no staging
  # scripts: scripts/build-kotlin.sh cross-compiles the native core, checks
  # bridge-symbol compat, and runs assembleRelease. Signed with the stable
  # release key from repo secrets (per-release keystores would break
  # updates); the asset keeps the updater's expected basename
  # (ANDROID_TOKEN in src/updater.rs). See RULES.md §6.9d.
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
      ANDROID_NDK_VERSION: 25.2.9519653
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ env.ANDROID_NDK_VERSION }}
          restore-keys: android-sdk-

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-kotlin-release-${{ hashFiles('Cargo.lock', 'android/**/*.gradle', 'android/gradle/wrapper/*') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-release-

      - name: Install Android command-line tools + SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          unzip -q cmdtools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # `yes |` auto-accepts the SDK/NDK licenses. Under `set -o pipefail`,
          # `yes` dies with a benign SIGPIPE (141) once sdkmanager stops reading;
          # sdkmanager writes the accepted-license files under
          # ${ANDROID_HOME}/licenses/. On a headless runner the interactive
          # prompt can fail (exit 1) even though the download itself is fine, so
          # we never let it abort the step: surface its output, and if no
          # accepted-license file exists afterwards, drop in the well-known
          # accepted hashes directly. The `ndk;…` install below still validates
          # acceptance and fails loudly if this ever did not work.
          licenses_dir="${ANDROID_HOME}/licenses"
          set +e
          yes | "$sdkmanager" --licenses >/tmp/sdk-licenses.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 141 ]; then
            echo "sdkmanager --licenses exited ${rc} (details):" >&2
            tail -n 40 /tmp/sdk-licenses.log >&2
          fi
          if [ ! -f "${licenses_dir}/android-sdk-license" ]; then
            echo "no accepted-license file found; writing known-good license hashes" >&2
            mkdir -p "${licenses_dir}"
            printf '%s\n' \
              8933bad161af4178b1185d1a37fbf41ea5269c55 \
              d56f5187479451eabf01fb78af6dfcb131a6481e \
              24333f8a63b6825ea9c5514f83c2829b004d1fee \
              > "${licenses_dir}/android-sdk-license"
            printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd \
              > "${licenses_dir}/android-sdk-preview-license"
          fi
          # The 0.7.10 android template defaults compileSdk/targetSdk to 34
          # (no `[android]` override in Dioxus.toml), so AGP needs the
          # android-34 platform + its build-tools for assembleRelease.
          "$sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Build owned Kotlin APK (release)
        shell: bash
        run: |
          set -euo pipefail
          # Updates only install when versionCode rises: CI stamps both from
          # the tag (name) + run number (monotonic code). The native version
          # comes from the top-level SPOTIFY_DX_RELEASE_VERSION env.
          export SPOTIFY_DX_VERSION_CODE="${{ github.run_number }}"
          export SPOTIFY_DX_VERSION_NAME="${GITHUB_REF_NAME#v}"
          # GRADLE_OFFLINE=0: the runner has no pre-seeded Gradle cache, so
          # plugins + deps resolve from the network (local builds stay offline).
          export GRADLE_OFFLINE=0
          ./scripts/build-kotlin.sh release
          ls -la android/app/build/outputs/apk/release/

      - name: Sign APK with stable release key
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # A stable key is load-bearing: per-release keystores silently break
          # the updater (signature mismatch on install). Fail loudly instead.
          # Single password for store + key (hex alphabet: no shell-quoting
          # hazard); see RULES.md §6.9d.
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!v:-}" ] || { echo "$v secret missing — see RULES.md §6.9d." >&2; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          # Fail-fast guard: store opens + alias holds a key, with a clear
          # message (apksigner's "Wrong password?" hides which secret broke).
          keytool -list -keystore "${RUNNER_TEMP}/release.jks" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" > /dev/null || {
            echo "keystore guard failed: B64 corrupt, wrong PASSWORD, or wrong ALIAS." >&2
            exit 1
          }
          bt="${ANDROID_HOME}/build-tools/34.0.0"
          apk_dir="android/app/build/outputs/apk/release"
          apk="$(ls "${apk_dir}"/app-release-unsigned.apk 2>/dev/null || ls "${apk_dir}"/app-release.apk | head -1)"
          [ -n "${apk}" ] && [ -f "${apk}" ] || { echo "no release APK in ${apk_dir}" >&2; exit 1; }
          # Asset basename MUST stay app-release-unsigned-signed.apk: the
          # updater matches releases by ANDROID_TOKEN (src/updater.rs).
          out="android/app-release-unsigned-signed.apk"
          "${bt}/apksigner" sign --ks "${RUNNER_TEMP}/release.jks" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$out" "$apk"
          "${bt}/apksigner" verify --verbose "$out"
          rm -f "${RUNNER_TEMP}/release.jks"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          if-no-files-found: error
          path: android/app-release-unsigned-signed.apk

  # Web (WASM) — build the browser bundle with `dx build --platform web` and ship
  # the generated site as an artifact. Note: web login (credentialed
  # cross-origin get_access_token) is still live-validation-pending; the bundle
  # builds regardless — see RULES.md §6.9c.
  web:
    runs-on: ubuntu-latest
    env:
      PROFILE: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32-

      - name: Build web (wasm) bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo install dioxus-cli --version 0.7.10 --locked 2>/dev/null || true
          dx build --platform web --release
          # `dx build` does NOT honor `out_dir`: web output always goes to
          # target/dx/<crate>/<profile>/web/public (DioxusLabs/dioxus#3328), so
          # package from there rather than a repo-root `dist/`.
          web_out="target/dx/spotify-dx/release/web/public"
          test -d "$web_out"
          version="${GITHUB_REF_NAME}"
          tar czf "${BIN}-${version}-web.tar.gz" -C "$web_out" .
          cp "${BIN}-${version}-web.tar.gz" "${BIN}-web.tar.gz"
          sha256sum "${BIN}-${version}-web.tar.gz" "${BIN}-web.tar.gz" > "${BIN}-web-sha256.txt"

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          if-no-files-found: error
          path: |
            spotify-dx-*-web.tar.gz
            spotify-dx-web-sha256.txt

  publish:
    needs: [build, android-apk, web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "spotify-dx ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
