# Deploys the Spotify DX landing page and the in-app web build to GitHub Pages.
#
# The app's web build is produced FROM SOURCE here (not from a committed
# bundle): every push to master rebuilds the Dioxus wasm app via
# scripts/build-web.sh and deploys it. NOTE: this script is NOT shared with
# the release workflow (release runs `dx build` directly for versioned
# tarballs) — see scripts/build-web.sh header.
#
# The repo is the `spotify-dx` project itself, so GitHub Pages for a project site
# publishes at https://mihneamoso.github.io/spotify-dx/. scripts/build-web.sh
# assembles a single staging directory with the correct mapping:
#   site/index.html...  -> https://mihneamoso.github.io/spotify-dx/     (landing page)
#   app/index.html...   -> https://mihneamoso.github.io/spotify-dx/app/ (Dioxus app)
#
# The landing page uses only relative URLs, and the app is built with
# `base_path = "spotify-dx/app"` in Dioxus.toml, so both work unchanged under
# the `/spotify-dx/` path prefix.
#
# The release workflow (release.yml) also ships a web build on version tags,
# but it runs `dx build` directly for versioned tarballs — a different
# command and output layout from scripts/build-web.sh (`dx bundle`).
# Keep the two paths in sync by hand.
#
# Setup (one time): Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned: floating `stable` once built wasm that wasm-bindgen
          # rejected while the same tree built cleanly locally (verified
          # on 1.97.1) — the only deltas were the toolchain and a stale
          # `target/` restore. Re-pin deliberately after verifying the
          # web bundle builds on the new version.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          # Registry only — never `target/`: a stale `target/` restore
          # across lock changes produced spooky wasm-bindgen failures
          # ("import doesn't have an adapter listed") on a tree that
          # built cleanly from scratch. Fresh target costs minutes,
          # debugging phantom failures costs more.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: pages-cargo-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-cargo-wasm32-
      - name: Install dx CLI
        run: |
          # Pinned to the repo's dx version (RULES: dx CLI 0.7.x) —
          # install.sh floats `latest`, whose bundle layout/behavior
          # may drift from what scripts/build-web.sh asserts.
          cargo install dioxus-cli --version 0.7.10 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build web bundle
        run: bash scripts/build-web.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
